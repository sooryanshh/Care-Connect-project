<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | CareConnect</title><link rel="stylesheet" href="../assets/css/common.css"></head><body class="login-page"><div class="login-card"><div class="login-brand"><div class="brand" style="color:#0f172a">CareConnect</div><div class="muted">Patient–Provider EHR System</div></div><form id="f"><div class="form-group"><label>Email</label><input required></div><br><div class="form-group"><label>Password</label><input type="password" required></div><br><div class="form-group"><label>Login as</label><select id="r"><option>Patient</option><option>Doctor</option><option>Admin</option></select></div><br><button class="btn btn-primary" style="width:100%">Login</button></form><p class="muted" style="text-align:center">New patient? <a href="register.html" style="color:#2563eb">Register</a></p></div><script>f.onsubmit=e=>{e.preventDefault();let r=document.getElementById('r').value;location.href=r==='Patient'?'../dashboards/patient-dashboard.html':r==='Doctor'?'../dashboards/doctor-dashboard.html':'../dashboards/admin-dashboard.html'}</script></body></html>
